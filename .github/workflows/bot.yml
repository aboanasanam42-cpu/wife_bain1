name: Run Binance Spot Bot

on:
  workflow_dispatch: # تشغيل يدوي عبر زر Run Workflow في GitHub Actions
  schedule:
    # خيار اختياري للتشغيل الدوري إذا رغبت
    - cron: '*/30 * * * *'

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Trading Bot
        env:
          BINANCE_API_KEY: ${{ secrets.BINANCE_API_KEY || secrets.BINANCE_KEY }}
          BINANCE_API_SECRET: ${{ secrets.BINANCE_API_SECRET || secrets.BINANCE_SECRET }}
          SYMBOL: ${{ secrets.SYMBOL || 'BTC/USDT' }}
          TARGET_ORDER_USD: ${{ secrets.TARGET_ORDER_USD || '5.5' }}
          MAX_POSITIONS: ${{ secrets.MAX_POSITIONS || '2' }}
          TAKE_PROFIT_PCT: ${{ secrets.TAKE_PROFIT_PCT || '1.5' }}
          STOP_LOSS_PCT: ${{ secrets.STOP_LOSS_PCT || '1.0' }}
          LOOP_INTERVAL_SEC: ${{ secrets.LOOP_INTERVAL_SEC || '10' }}
          BUY_COOLDOWN_SEC: ${{ secrets.BUY_COOLDOWN_SEC || '180' }}
        run: |
          python main.py
