name: Binance Spot Trading Bot

on:
  schedule:
    # تشغيل تلقائي كل 5 دقائق لضمان استمرارية المراقبة
    - cron: '*/5 * * * *'
  workflow_dispatch: # يتيح لك أيضاً زر التشغيل اليدوي في أي وقت

jobs:
  run-trader:
    runs-on: ubuntu-latest
    timeout-minutes: 350 # حد أقصى للجلسة قبل التجديد

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Trading Bot
        env:
          BINANCE_API_KEY: ${{ secrets.BINANCE_API_KEY }}
          BINANCE_API_SECRET: ${{ secrets.BINANCE_API_SECRET }}
          SYMBOL: 'BTC/USDT'
          TARGET_ORDER_USD: '4.0'
          MAX_POSITIONS: '2'
          TAKE_PROFIT_PCT: '1.0'
          STOP_LOSS_PCT: '1.0'
          LOOP_INTERVAL_SEC: '10'
          BUY_COOLDOWN_SEC: '300'
        run: |
          python main.py
